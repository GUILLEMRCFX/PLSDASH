<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- Declara que la barra de estado se pinta encima; sin esto el recorte que
     reporta iOS depende de la version. Ver la nota de `.marco`. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PLSDASH · núcleo</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/val/v2/paneles/estilo.css">
<style>
  *{box-sizing:border-box}
  html{height:100%}
  body{
    /* Negro puro. Cualquier degradado de fondo, por tenue que sea, levanta el
       nivel de negro entre las celdas y con él se va el contraste — que es
       donde de verdad se juega la sensación de nitidez. */
    margin:0;min-height:100%;background:var(--negro);color:var(--cian-suave);
    font-family:var(--texto);
    -webkit-text-size-adjust:100%;
  }

  /* ───────────────────────────────────────────── retícula
     Una sola columna, centrada. La esfera ya no comparte pantalla con nada:
     tiene su propia pestaña y ahí ocupa lo que haya. */
  .marco{
    display:block;
    padding:12px;
    padding-top:calc(12px + env(safe-area-inset-top,0px));
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    padding-left:calc(12px + env(safe-area-inset-left,0px));
    padding-right:calc(12px + env(safe-area-inset-right,0px));
    /* 1100 y no 1680: a lo ancho de una pantalla grande, el contenido de un
       panel se estiraba hasta que la etiqueta y su cifra quedaban a un palmo la
       una de la otra y había que recorrer la línea con el dedo. */
    max-width:1100px;margin:0 auto;
  }

  /* ───────────────────────────────────────────── la esfera, en su pestaña
     Antes vivía fija encima del contenido y se comía el primer tercio del móvil
     para responder algo que cabe en una línea. Ahora es una pestaña más y
     ocupa lo que le sobra a la barra: quien la quiera ver, la abre.

     Dos cosas salen gratis de este cambio y conviene dejarlas escritas:
       · Deja de dibujarse cuando no se ve. El `IntersectionObserver` de
         `esfera.js` ya apagaba el bucle si el contenedor salía de pantalla; con
         la pestaña oculta el efecto es el mismo, y en el móvil eso es batería.
       · Se remide sola al volver, por el `ResizeObserver` del mismo módulo. */
  #escena{
    position:relative;
    width:100%;
    /* Lo que queda de pantalla quitando la barra de pestañas y los márgenes. */
    height:calc(100dvh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    min-height:280px;
    max-height:820px;
    /* La esfera se lleva el gesto entero dentro de su caja. */
    touch-action:none;
  }
  #escena canvas{display:block;width:100%;height:100%}

  /* Rótulo del nodo señalado. Se coloca con `transform` y no con `top/left`
     porque se mueve en cada fotograma mientras la esfera gira: `transform` no
     provoca reflujo. */
  #rotulo{
    position:absolute;left:0;top:0;margin:0;
    pointer-events:none;
    font:500 12px/1.25 var(--texto);
    white-space:nowrap;
    padding:6px 10px;
    border-radius:8px;
    background:rgba(6,14,20,.9);
    border:1px solid var(--borde-vivo);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;gap:9px;align-items:baseline;
    transform-origin:0 0;
  }
  #rotulo[hidden]{display:none}
  #rotulo .r-id{color:var(--cian);letter-spacing:.02em;font-weight:600}
  #rotulo .r-blq{color:var(--apagado);font-size:11px}
  #rotulo.inactivo .r-id{color:var(--naranja)}

  /* Pie de la pestaña de la esfera: qué codifica lo que se está viendo. Sin
     esto, un punto más gordo que otro es decoración. */
  .esfera-pie{
    margin:10px 2px 0;
    display:flex;flex-wrap:wrap;gap:6px 18px;
    font:400 12px/1.5 var(--texto);color:var(--apagado);
  }
  .esfera-pie b{color:var(--cian-suave);font-weight:600}

  #contenido{min-width:0}

  /* Las vistas viven a la vez en el DOM y solo una se enseña. Cambiar de
     pestaña no vuelve a pedir datos ni a construir HTML. */
  .vista{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    align-content:start;
    min-width:0;
  }

  @media (min-width:820px){
    .marco{padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
    .vista{
      /* 340 y no 290: por debajo de eso una tarjeta con etiqueta y cifra en la
         misma línea empieza a partir palabras. */
      grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
      gap:18px;
      /* Cada panel a su altura: estirar iguala las filas y deja al panel corto
         con un palmo de vidrio vacío debajo de su último dato. */
      align-items:start;
    }
    /* La esfera nunca se parte en columnas. */
    #v-esfera{grid-template-columns:1fr}
  }

  #cargando{
    font:400 11px/1 var(--texto);letter-spacing:.16em;text-transform:uppercase;
    color:var(--apagado);padding:18px 2px;
  }
</style>
</head>
<body>

<main class="marco">
  <div id="contenido">
    <nav class="pestanas" role="tablist" aria-label="Secciones del panel">
      <button type="button" role="tab" id="t-resumen"     aria-controls="v-resumen"     aria-selected="true">Resumen</button>
      <button type="button" role="tab" id="t-ganancias"   aria-controls="v-ganancias"   aria-selected="false" tabindex="-1">Ganancias</button>
      <button type="button" role="tab" id="t-validadores" aria-controls="v-validadores" aria-selected="false" tabindex="-1">Validadores</button>
      <button type="button" role="tab" id="t-nodo"        aria-controls="v-nodo"        aria-selected="false" tabindex="-1">Nodo</button>
      <button type="button" role="tab" id="t-esfera"      aria-controls="v-esfera"      aria-selected="false" tabindex="-1">Esfera</button>
    </nav>

    <div class="vista" role="tabpanel" id="v-resumen"     aria-labelledby="t-resumen"     tabindex="0"></div>
    <div class="vista" role="tabpanel" id="v-ganancias"   aria-labelledby="t-ganancias"   tabindex="0" hidden></div>
    <div class="vista" role="tabpanel" id="v-validadores" aria-labelledby="t-validadores" tabindex="0" hidden></div>
    <div class="vista" role="tabpanel" id="v-nodo"        aria-labelledby="t-nodo"        tabindex="0" hidden></div>

    <!-- ⚠ Esta vista NO la repinta `pintar()`. Las otras cuatro se regeneran
         enteras en cada refresco con `innerHTML`, y hacerlo aquí arrancaría el
         lienzo de WebGL del DOM cada 18 segundos: se perdería el contexto y con
         él la esfera. Lo marca `estatica: true` en `PESTANAS`. -->
    <div class="vista" role="tabpanel" id="v-esfera" aria-labelledby="t-esfera" tabindex="0" hidden>
      <div id="escena">
        <!-- `aria-hidden`: la esfera es decoración con dato, y el mismo dato
             está en la tabla de Validadores, que sí se puede leer y recorrer. -->
        <p id="rotulo" hidden aria-hidden="true">
          <span class="r-id"></span><span class="r-blq"></span>
        </p>
      </div>
      <p class="esfera-pie">
        <span>Un punto por validador · <b>el tamaño</b> son sus bloques propuestos</span>
        <span><b>El brillo</b> sube con el ciclo de barrido y cae al cobrarlo</span>
        <span><b>Gris</b> = dato viejo · toca un punto para ver cuál es</span>
      </p>
    </div>
  </div>
</main>

<script type="importmap">
{ "imports": { "three": "/val/v2/vendor/three.module.js" } }
</script>

<script type="module">
  import { crearEsfera } from './escena/esfera.js';
  import { escenaDesde } from './escena/estado-escena.js';
  import { cargarTodo } from './datos.js';
  import { panelResumen, engancharResumen } from './paneles/resumen.js';
  import { panelGanancias } from './paneles/ganancias.js';
  import { panelCiclo, engancharCiclo } from './paneles/ciclo.js';
  import { panelTrayectoria } from './paneles/trayectoria.js';
  import { panelPrecio } from './paneles/precio-historico.js';
  import { panelValidadores } from './paneles/validadores.js';
  import { panelSaludNodo } from './paneles/salud-nodo.js';
  import { panelEstadoGlobal } from './paneles/estado-global.js';
  import { panelRegistro } from './paneles/registro.js';
  import { latir } from './paneles/pulso.js';

  const q = new URLSearchParams(location.search);
  // `?escalon=` fuerza un escalón de calidad, para comparar en una misma
  // máquina lo que en otro caso decidiría la heurística.
  const forzado = q.get('escalon');

  // El rótulo del validador señalado. Vive en el DOM y no en una textura: es
  // texto de verdad, nítido a cualquier densidad, y no hay que subir nada a la
  // GPU cada vez que cambia el recuento de validadores.
  const rotulo = document.getElementById('rotulo');

  const esfera = crearEsfera(document.getElementById('escena'), {
    escalon: ['alto', 'medio', 'bajo'].includes(forzado) ? forzado : null,
    alSenalar(n) {
      if (!n) { rotulo.hidden = true; return; }
      rotulo.querySelector('.r-id').textContent = n.indice;
      rotulo.querySelector('.r-blq').textContent =
        n.bloques === 1 ? '1 bloque' : `${n.bloques} bloques`;
      rotulo.classList.toggle('inactivo', n.activo === false);
      // El segundo `translate` es el centrado sobre el nodo, en porcentaje del
      // propio rótulo: tiene que ir aquí y no en el CSS, porque escribir
      // `transform` desde JS sustituye la propiedad entera.
      rotulo.style.transform =
        `translate(${Math.round(n.x)}px, ${Math.round(n.y)}px) translate(-50%, -150%)`;
      rotulo.hidden = false;
    },
  });

  // ⚠ La esfera arranca VACÍA, sin un solo nodo, y se llena cuando llegan los
  //   datos. Antes arrancaba con diez nodos inventados de `datos-falsos.js`,
  //   que es de donde salía el 10 con once validadores activos. Ese fichero ya
  //   no existe: si los datos no llegan, no hay nodos, y eso se ve — que es
  //   justo lo que no pasaba antes.
  //
  //   El `?n=` para forzar un número de nodos falsos se va con él.

  // Se expone ANTES de nada. Si algo de lo de abajo fallase, `__esfera` sigue
  // estando en la consola y se puede diagnosticar desde ahí.
  window.__esfera = esfera;

  /* ───────────────────────────────────────────── pestañas

     Cada pestaña responde a una pregunta distinta, y ese es el criterio de
     reparto — no «cuántos paneles caben en cada una»:

       Resumen     ¿cuánto llevo y va todo bien?   (sin desplazarse)
       Ganancias   ¿de dónde sale y hacia dónde va?
       Validadores ¿cuál de ellos está raro?
       Nodo        ¿cómo está la máquina, y qué ha pasado?

     El ritmo por periodos vivía en un panel propio y ahora está dentro de
     Resumen: era lo primero que hay que responder. Ver `paneles/ritmo.js`. */

  const PESTANAS = [
    { id: 'resumen',     paneles: [panelResumen] },
    { id: 'ganancias',   paneles: [panelGanancias, panelCiclo, panelTrayectoria, panelPrecio] },
    { id: 'validadores', paneles: [panelValidadores] },
    { id: 'nodo',        paneles: [panelSaludNodo, panelEstadoGlobal, panelRegistro] },
    // `estatica`: su HTML lo escribió el documento y no se regenera nunca. Ver
    // el aviso junto a `#v-esfera` en el marcado.
    { id: 'esfera',      paneles: [], estatica: true },
  ];

  const tabs = PESTANAS.map(p => document.getElementById(`t-${p.id}`));
  const vistas = PESTANAS.map(p => document.getElementById(`v-${p.id}`));

  // El hash manda: recargar con `#nodo` abre Nodo. Así un enlace a una pestaña
  // concreta funciona, y un refresco no devuelve siempre a Resumen.
  const desdeHash = () => {
    const i = PESTANAS.findIndex(p => p.id === location.hash.slice(1));
    return i < 0 ? 0 : i;
  };

  let activa = desdeHash();

  function activar(i, { mover = true, animar = true, sellarHash = true } = {}) {
    activa = i;
    PESTANAS.forEach((p, j) => {
      const sel = j === i;
      tabs[j].setAttribute('aria-selected', String(sel));
      tabs[j].tabIndex = sel ? 0 : -1;
      vistas[j].hidden = !sel;
    });

    // La animación de entrada se pone SOLO al cambiar de pestaña. Si viviera
    // en la clase `.vista` a secas se repetiría en cada refresco de datos —
    // un parpadeo cada 18 segundos mientras miras un número.
    if (animar) {
      const v = vistas[i];
      v.classList.remove('entrando');
      void v.offsetWidth;          // reinicia la animación
      v.classList.add('entrando');
    }
    if (mover) tabs[i].focus();
    // El hash solo se escribe al cambiar de pestaña a mano. En el arranque no:
    // abrir /val/v2/ y ver cómo la barra de direcciones se convierte sola en
    // /val/v2/#resumen parece que la página ha hecho algo raro.
    if (sellarHash && location.hash.slice(1) !== PESTANAS[i].id) {
      history.replaceState(null, '', `#${PESTANAS[i].id}`);
    }
    // El pulso puede haber entrado en pantalla justo ahora: que no espere al
    // siguiente segundo para ponerse al día.
    latir();
  }

  tabs.forEach((t, i) => t.addEventListener('click', () => activar(i, { mover: false })));

  // Flechas, Inicio y Fin, que es lo que espera quien navega por teclado en un
  // `tablist`. Sin esto el `role="tab"` promete algo que no cumple.
  document.querySelector('.pestanas').addEventListener('keydown', ev => {
    const salto = { ArrowRight: 1, ArrowLeft: -1 }[ev.key];
    if (salto) activar((activa + salto + tabs.length) % tabs.length);
    else if (ev.key === 'Home') activar(0);
    else if (ev.key === 'End') activar(tabs.length - 1);
    else return;
    ev.preventDefault();
  });

  window.addEventListener('hashchange', () => activar(desdeHash(), { mover: false }));

  /* ───────────────────────────────────────────── paneles */

  let ultimos = null;

  function pintar(datos) {
    ultimos = datos;

    // La esfera es el fondo de las cuatro pestañas, así que se actualiza aquí y
    // no dentro de ninguna: sus nodos son los validadores reales, su brillo el
    // avance del ciclo de barrido y su color la frescura del dato.
    esfera.actualizar(escenaDesde(datos, datos.ahoraS));

    PESTANAS.forEach((p, i) => {
      if (p.estatica) return;
      vistas[i].innerHTML = p.paneles.map(fn => fn(datos)).join('');
    });
    // Las dos capas interactivas se pierden con el HTML, que se regenera
    // entero: hay que volver a engancharlas en cada repintado.
    engancharCiclo(document, datos);
    engancharResumen(document, () => pintar(ultimos));
    window.__datos = datos;
  }

  /* ───────────────────────────────────────────── refresco

     15-20 s para que el pulso de datos se note en tiempo real. NO es la
     frecuencia del recolector: el NUC sigue empujando a KV cada 3 minutos por
     la cuota de escrituras, y tocar eso aquí no serviría de nada — lo único
     que cambia es cada cuánto se vuelve a leer lo que ya está publicado. */
  const REFRESCO_MS = 18000;

  async function refrescar() {
    try {
      pintar(await cargarTodo());
    } catch (e) {
      // `cargarTodo` ya absorbe los fallos por endpoint; llegar aquí es un
      // fallo del propio módulo, y callarlo dejaría la pantalla de carga fija.
      console.error('[val/v2] no se pudieron cargar los datos:', e);
      // Nunca sobre la vista de la esfera: se llevaría el lienzo por delante.
      const destino = PESTANAS[activa].estatica ? vistas[0] : vistas[activa];
      destino.innerHTML =
        '<section class="panel" data-alerta><p class="p-aviso">'
        + 'No se pudieron cargar los datos del panel.</p></section>';
    }
  }

  activar(activa, { mover: false, animar: false, sellarHash: false });
  if (!PESTANAS[activa].estatica)
    vistas[activa].innerHTML = '<div id="cargando">Cargando…</div>';
  refrescar();
  setInterval(refrescar, REFRESCO_MS);

  // El pulso corre a su propio ritmo. Los datos llegan cada 18 s, pero la
  // cuenta atrás tiene que avanzar segundo a segundo: si solo se moviera con
  // los datos, daría saltos de 18 y no parecería una cuenta atrás.
  //
  // Y cuando cruza el umbral —de «llega en plazo» a «sin señal» o al revés— se
  // repinta el panel con los datos que ya hay: la palabra de estado y la franja
  // de alerta las decide `panelResumen`, y sin este aviso tardarían hasta 18
  // segundos en enterarse de lo que el pulso ya está diciendo en naranja.
  let pulsoPrevio = null;
  setInterval(() => {
    const ahora = latir();
    if (ahora && pulsoPrevio && ahora !== pulsoPrevio && ultimos) pintar(ultimos);
    if (ahora) pulsoPrevio = ahora;
  }, 1000);
</script>
</body>
</html>
