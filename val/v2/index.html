<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>PLSDASH · núcleo</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/val/v2/paneles/estilo.css">
<style>
  *{box-sizing:border-box}
  html{height:100%}
  body{
    /* Negro puro. Cualquier degradado de fondo, por tenue que sea, levanta el
       nivel de negro entre las celdas y con él se va el contraste — que es
       donde de verdad se juega la sensación de nitidez. */
    margin:0;min-height:100%;background:var(--negro);color:var(--cian-suave);
    font-family:var(--mono);
    -webkit-text-size-adjust:100%;
  }

  /* ───────────────────────────────────────────── retícula
     Móvil: la esfera se queda con la mayor parte de la primera pantalla y los
     paneles caen debajo en una sola columna.

     Escritorio: la esfera manda en el centro y los paneles se reparten a los
     lados. Crece sola — las columnas se llenan con lo que haya, y una columna
     sin paneles no ocupa nada. No hay huecos esperando contenido. */
  .marco{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    padding:14px;
    padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
    max-width:1680px;margin:0 auto;
  }

  #escena{
    position:relative;
    /* dvh y no vh: en móvil la barra del navegador se retrae y con vh la
       esfera quedaría cortada al arrancar. */
    height:58dvh;min-height:300px;
    /* La esfera se lleva el gesto entero dentro de su caja; fuera de ella la
       página se desplaza con normalidad. */
    touch-action:none;
  }
  #escena canvas{display:block;width:100%;height:100%}

  /* Las columnas desaparecen como caja en móvil (`display:contents`), así que
     los paneles caen directamente en la retícula, en orden. Se reparten
     llenando primero la izquierda: con 2 paneles sale 1 y 2, y en móvil el
     orden de lectura sigue siendo el correcto. */
  .col{display:contents}

  @media (min-width:1000px){
    .marco{
      grid-template-columns:minmax(320px,1fr) minmax(0,1.7fr) minmax(320px,1fr);
      grid-template-areas:"izq escena der";
      gap:18px;padding:18px;
      align-items:start;
      min-height:100dvh;
    }
    #escena{
      grid-area:escena;
      height:calc(100dvh - 36px);
      position:sticky;top:18px;
    }
    .col{display:flex;flex-direction:column;gap:18px;position:sticky;top:18px}
    #colIzq{grid-area:izq}
    #colDer{grid-area:der}
  }

  /* Conmutador PROVISIONAL de geometría. Vive dentro de la caja de la escena y
     no pegado a la ventana: si fuera `fixed` taparía los paneles en móvil.
     Se quita cuando la geometría esté decidida. */
  #geo{
    position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:10px;
    display:flex;gap:2px;padding:3px;border-radius:11px;
    background:rgba(10,18,26,.72);border:1px solid var(--borde-vivo);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #geo button{
    font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#5d7f8d;background:none;border:0;border-radius:8px;
    padding:8px 13px;cursor:pointer;transition:.14s;
    min-height:34px;
  }
  /* Apagado a propósito: es andamiaje de desarrollo, no un control del panel.
     En cian encendido era lo más llamativo de la pantalla. */
  #geo button.on{color:#04121a;background:rgba(42,212,240,.62)}
  #geo button:not(.on):hover{color:#a8e6f5}

  #cargando{
    font:400 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--apagado);padding:18px 2px;
  }
</style>
</head>
<body>

<main class="marco">
  <div id="escena">
    <nav id="geo" aria-label="Geometría de la malla (provisional)">
      <button type="button" data-geo="voronoi" class="on">Voronoi</button>
      <button type="button" data-geo="geodesica">Geodésica</button>
    </nav>
  </div>

  <!-- Los paneles se inyectan aquí. Una columna sin paneles no pinta nada. -->
  <div class="col" id="colIzq"></div>
  <div class="col" id="colDer"></div>
</main>

<script type="importmap">
{ "imports": { "three": "/val/v2/vendor/three.module.js" } }
</script>

<script type="module">
  import { crearEsfera } from './escena/esfera.js';
  import { estadoFalso } from './datos-falsos.js';
  import { cargarTodo } from './datos.js';
  import { panelEstadoGlobal } from './paneles/estado-global.js';
  import { panelGanancias } from './paneles/ganancias.js';

  const q = new URLSearchParams(location.search);
  // `?escalon=` fuerza un escalón de calidad, para comparar en una misma
  // máquina lo que en otro caso decidiría la heurística.
  const forzado = q.get('escalon');
  const nFalsos = Number(q.get('n')) || undefined;

  const esfera = crearEsfera(document.getElementById('escena'), {
    escalon: ['alto', 'medio', 'bajo'].includes(forzado) ? forzado : null,
    geometria: q.get('geo') === 'geodesica' ? 'geodesica' : 'voronoi',
  });

  // La esfera sigue con datos inventados: sus nodos son decoración, no la
  // topología real de la red. Cuando dejen de serlo no habrá que tocarla.
  esfera.actualizar(estadoFalso(nFalsos));

  // Se expone ANTES de nada. Si algo de lo de abajo fallase, `__esfera` sigue
  // estando en la consola y se puede diagnosticar desde ahí.
  window.__esfera = esfera;

  /* ───────────────────────────────────────────── paneles */

  const columnas = [document.getElementById('colIzq'), document.getElementById('colDer')];
  const PANELES = [panelEstadoGlobal, panelGanancias];

  function pintar(datos) {
    // Se reparten llenando la izquierda primero: así el orden en móvil —donde
    // las columnas se disuelven— sigue siendo el de lectura.
    const mitad = Math.ceil(PANELES.length / 2);
    const trozos = [PANELES.slice(0, mitad), PANELES.slice(mitad)];
    columnas.forEach((col, i) => {
      col.innerHTML = trozos[i].map(p => p(datos)).join('');
    });
    window.__datos = datos;
  }

  const REFRESCO_MS = 60000;

  async function refrescar() {
    try {
      pintar(await cargarTodo());
    } catch (e) {
      // `cargarTodo` ya absorbe los fallos por endpoint; llegar aquí es un
      // fallo del propio módulo, y callarlo dejaría la pantalla de carga fija.
      console.error('[val/v2] no se pudieron cargar los datos:', e);
      columnas[0].innerHTML =
        '<section class="panel" data-alerta><p class="p-aviso">'
        + 'No se pudieron cargar los datos del panel.</p></section>';
    }
  }

  columnas[0].innerHTML = '<div id="cargando">Cargando…</div>';
  refrescar();
  setInterval(refrescar, REFRESCO_MS);

  /* ───────────────────────────────────────────── conmutador provisional */

  const nav = document.getElementById('geo');

  // Si el navegador sirviese un `esfera.js` viejo de su caché, esta API no
  // existiría y los botones dejarían de responder SIN decir nada.
  const apiOk = typeof esfera.setGeometria === 'function'
             && typeof esfera.getGeometria === 'function';

  if (!apiOk) {
    nav.innerHTML = '<span style="padding:9px 14px;font-size:11px;color:#ff8a3d">'
      + 'módulo desactualizado · recarga forzada (Ctrl/Cmd + Shift + R)</span>';
    console.error('[val/v2] esfera.js no expone setGeometria/getGeometria: '
      + 'el navegador está sirviendo una versión antigua del módulo.');
  } else {
    const pintarBotones = () => {
      const activo = esfera.getGeometria();
      for (const b of nav.querySelectorAll('button')) b.classList.toggle('on', b.dataset.geo === activo);
    };
    nav.addEventListener('click', ev => {
      const b = ev.target.closest('button');
      if (!b) return;
      esfera.setGeometria(b.dataset.geo);
      pintarBotones();
    });
    pintarBotones();
  }
</script>
</body>
</html>
