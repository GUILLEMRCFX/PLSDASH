<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- Declara que la barra de estado se pinta encima; sin esto el recorte que
     reporta iOS depende de la version. Ver la nota de `.marco`. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PLSDASH · núcleo</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/val/v2/paneles/estilo.css">
<!-- Antes que nada: la pantalla de carga se pinta en el primer fotograma y
     no puede esperar a que llegue una hoja de estilo por detrás. -->
<link rel="stylesheet" href="/val/v2/carga/carga.css">
<!-- La puerta del PIN. Va aquí y no dentro de la hoja de paneles porque es lo
     primero que ve quien llega sin sesión: tiene que poder pintarse sin
     depender de 1.500 líneas de estilos de tarjetas. -->
<link rel="stylesheet" href="/val/v2/puerta.css">
<!-- El tema se pone ANTES de pintar: si esperara a los paneles, el panel
     arrancaría en el tema de omisión y saltaría al elegido a los pocos
     cientos de milisegundos. Un parpadeo de color en cada carga. -->
<script type="module">
  import { aplicarGuardado } from '/val/v2/paneles/tema.js';
  aplicarGuardado();
</script>
<style>
  *{box-sizing:border-box}
  html{height:100%}
  body{
    /* Negro puro. Cualquier degradado de fondo, por tenue que sea, levanta el
       nivel de negro entre las celdas y con él se va el contraste — que es
       donde de verdad se juega la sensación de nitidez. */
    margin:0;min-height:100%;background:var(--fondo);color:var(--dato-suave);
    font-family:var(--texto);
    -webkit-text-size-adjust:100%;
  }

  /* ───────────────────────────────────────────── retícula
     Una sola columna, centrada. La esfera ya no comparte pantalla con nada:
     tiene su propia pestaña y ahí ocupa lo que haya. */
  /* ⚠ COLUMNA FLEXIBLE Y NO BLOQUE, para que la esfera pueda quedarse con lo
     que sobre de pantalla MEDIDO, no restado a ojo. Antes `#escena` llevaba un
     `100dvh - 260px` y ese 260 solo cuadraba en una combinación: medido, el
     aire de debajo del pie iba de 18px a 138px según envolviera la barra de
     pestañas o el pie ocupara dos o tres líneas. Con la columna, la escena
     crece o encoge sola y no hay número que ajustar al añadir la siguiente
     pestaña. Las otras cuatro vistas no se enteran: van `flex:0 0 auto`, que
     es lo mismo que hacían de bloque. */
  .marco{
    display:flex;flex-direction:column;
    min-height:100dvh;
    padding:12px;
    padding-top:calc(12px + env(safe-area-inset-top,0px));
    /* En móvil la barra es una píldora FLOTANTE abajo, o sea fuera del flujo:
       si no se reserva su alto aquí, el último panel se queda debajo y no hay
       manera de leerlo. 62 es la píldora expandida, 12 su separación del borde,
       y el área segura lo que pida el teléfono. */
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    padding-left:calc(12px + env(safe-area-inset-left,0px));
    padding-right:calc(12px + env(safe-area-inset-right,0px));
    /* 1100 y no 1680: a lo ancho de una pantalla grande, el contenido de un
       panel se estiraba hasta que la etiqueta y su cifra quedaban a un palmo la
       una de la otra y había que recorrer la línea con el dedo. */
    max-width:1100px;margin:0 auto;
  }

  /* ───────────────────────────────────────────── la esfera, en su pestaña
     Antes vivía fija encima del contenido y se comía el primer tercio del móvil
     para responder algo que cabe en una línea. Ahora es una pestaña más y
     ocupa lo que le sobra a la barra: quien la quiera ver, la abre.

     Dos cosas salen gratis de este cambio y conviene dejarlas escritas:
       · Deja de dibujarse cuando no se ve. El `IntersectionObserver` de
         `esfera.js` ya apagaba el bucle si el contenedor salía de pantalla; con
         la pestaña oculta el efecto es el mismo, y en el móvil eso es batería.
       · Se remide sola al volver, por el `ResizeObserver` del mismo módulo. */
  /* La pestaña de la esfera es la única que se estira: dentro de ella, el pie
     ocupa lo suyo y la escena se queda con el resto. `min-height:0` porque un
     hijo de flex no baja de su contenido mínimo si no se le dice. */
  #v-esfera{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;
  }

  #escena{
    position:relative;
    width:100%;
    /* Sin altura calculada: se queda con lo que sobre dentro de la columna,
       después de la barra y del pie. El mínimo es para que en una pantalla
       muy baja siga siendo una esfera y no una raya.

       ⚠ La base es `0` y NO `auto`. Con `auto` la base sale del contenido, y el
         contenido es un `<canvas>` con `height:100%`: contra una altura sin
         resolver, el porcentaje cae en el atributo `height` del lienzo —que lo
         pone `setSize()` a partir del alto anterior—. Se realimenta: medido a
         360×780 la escena se quedaba en 586px y la página desbordaba 45. Con
         base `0` el reparto no mira el contenido. */
    flex:1 1 0;
    min-height:260px;
    max-height:820px;
    /* La esfera se lleva el gesto entero dentro de su caja. */
    touch-action:none;
  }
  #escena canvas{display:block;width:100%;height:100%}

  /* Rótulo del nodo señalado. Se coloca con `transform` y no con `top/left`
     porque se mueve en cada fotograma mientras la esfera gira: `transform` no
     provoca reflujo. */
  #rotulo{
    position:absolute;left:0;top:0;margin:0;
    pointer-events:none;
    font:500 12px/1.25 var(--texto);
    white-space:nowrap;
    padding:6px 10px;
    border-radius:8px;
    background:var(--vidrio-denso);
    border:1px solid var(--borde-vivo);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;gap:9px;align-items:baseline;
    transform-origin:0 0;
  }
  #rotulo[hidden]{display:none}
  #rotulo .r-id{color:var(--dato);letter-spacing:.02em;font-weight:600}
  #rotulo .r-blq{color:var(--apagado);font-size:11px}
  #rotulo.inactivo .r-id{color:var(--acento)}
  /* El que espera turno se rotula en el color de «va bien», no en el de alerta:
     no le pasa nada, es que aún no ha empezado. */
  #rotulo.pendiente .r-id{color:var(--bien)}
  #rotulo.pendiente .r-blq{color:var(--bien);opacity:.85}

  /* Pie de la pestaña de la esfera: qué codifica lo que se está viendo. Sin
     esto, un punto más gordo que otro es decoración.

     ⚠ ERA UN FLEX QUE ENVOLVÍA, y en el móvil quedaba mal: las tres leyendas
       no caben en una línea a 390, así que cada una bajaba a la suya y las tres
       se apilaban CONTRA EL BORDE IZQUIERDO, con el lado derecho vacío. Y
       pegadas abajo, porque la escena se lleva todo el alto disponible.

       Con `grid` van centradas y en columna, cada una en su línea a propósito y
       no por desbordar. En pantalla ancha vuelven a la fila, que es donde caben
       de sobra. El aire de abajo lo pone el margen, no la suerte. */
  .esfera-pie{
    flex:none;
    /* 10 abajo y no 4: es el único aire que separa la última línea del borde,
       y ahora es una cifra fija —16px hasta el filo, más el `safe-area` del
       móvil— en vez de la sobra que dejara el cálculo de la escena. */
    margin:14px 2px 10px;
    display:grid;justify-items:center;gap:7px;
    text-align:center;
    font:400 12.5px/1.45 var(--texto);color:var(--apagado);
  }
  @media (min-width:700px){
    .esfera-pie{
      grid-auto-flow:column;justify-content:center;gap:0 26px;
    }
  }
  .esfera-pie b{color:var(--dato-suave);font-weight:600}

  /* El envoltorio de verdad de la barra y las vistas: la columna tiene que
     seguir aquí para que llegue a `#v-esfera`. Poniéndola solo en `.marco` se
     quedaba a mitad de camino —`#contenido` es su único hijo— y la escena no
     crecía. */
  #contenido{
    min-width:0;
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;
  }

  /* Las vistas viven a la vez en el DOM y solo una se enseña. Cambiar de
     pestaña no vuelve a pedir datos ni a construir HTML. */
  .vista{
    flex:0 0 auto;
    display:grid;
    /* ⚠ `minmax(0,1fr)` y NO `1fr`. Son distintos: `1fr` es `minmax(auto,1fr)`,
       y ese `auto` significa «no bajes del ancho mínimo del contenido». Basta
       con que un hijo tenga un mínimo intrínseco grande —una cifra larga, un
       título oculto— para que la columna entera se niegue a encoger y la
       tarjeta se salga de la pantalla. Medido a 320px: el panel se quedaba en
       313px dentro de un hueco de 296 y la página desbordaba 7px.
       Con `minmax(0,…)` la columna puede encoger y el contenido se adapta. */
    grid-template-columns:minmax(0,1fr);
    gap:14px;
    align-content:start;
    min-width:0;
  }

  @media (max-width:819px){
    .marco{padding-bottom:calc(74px + max(env(safe-area-inset-bottom,0px),12px))}
  }
  @media (max-width:819px) and (display-mode: standalone){
    .marco{padding-bottom:calc(74px + max(env(safe-area-inset-bottom,0px),22px))}
  }

  @media (min-width:820px){
    .marco{padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
    .vista{
      /* 340 y no 290: por debajo de eso una tarjeta con etiqueta y cifra en la
         misma línea empieza a partir palabras. */
      grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));
      gap:18px;
      /* Cada panel a su altura: estirar iguala las filas y deja al panel corto
         con un palmo de vidrio vacío debajo de su último dato. */
      align-items:start;
    }
    /* La esfera no necesita excepción aquí: desde que es una columna flexible
       no le llega el `grid-template-columns` de `.vista`. */
  }

  /* ⚠ NO QUITAR. La regla del navegador para `[hidden]` es
     `[hidden]:not([hidden="until-found"])`: dos atributos, o sea que le gana a
     una clase pero PIERDE contra un id. En cuanto `#v-esfera` se llevó su
     propio `display` para la columna, la esfera dejó de esconderse: seguía
     dibujándose al pie de las otras cuatro pestañas —gastando GPU en algo que
     nadie estaba mirando— y solo se vio en una captura de Validadores con la
     esfera debajo. Con `!important` ninguna regla futura vuelve a ganarle. */
  .vista[hidden]{display:none !important}

  #cargando{
    font:400 11px/1 var(--texto);letter-spacing:.16em;text-transform:uppercase;
    color:var(--apagado);padding:18px 2px;
  }
</style>
</head>
<body>

<main class="marco">
  <div id="contenido">
    <!-- ⚠ El engranaje del tema va DENTRO de la barra pero FUERA del `<nav>`, y
         las dos cosas importan:

           · El `<nav>` es `role="tablist"` y sus hijos son `role="tab"`. Un
             botón que no es una pestaña ahí dentro rompe lo que el rol promete
             a quien navega con lector de pantalla.
           · El manejador de flechas cuelga de `.pestanas`. Con el engranaje
             fuera, pulsar → con el foco en él ya no salta de pestaña — sin
             filtrar el objetivo del evento ni ninguna otra costura.

         Visualmente siguen siendo una sola barra: el fondo, el borde y el
         redondeo se los pone `.barra`, no `.pestanas`. -->
    <div class="barra">
      <nav class="pestanas" role="tablist" aria-label="Secciones del panel">
        <button type="button" role="tab" id="t-resumen" aria-controls="v-resumen" aria-selected="true"><span class="pt-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M12 13l4.5-3.5"/><circle cx="12" cy="13" r="1.4"/></svg></span><span class="pt-eti">Resumen</span></button>
        <button type="button" role="tab" id="t-ganancias" aria-controls="v-ganancias" aria-selected="false" tabindex="-1"><span class="pt-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 3.5 3.5L20 8"/><path d="M20 13V8h-5"/></svg></span><span class="pt-eti">Ganancias</span></button>
        <button type="button" role="tab" id="t-validadores" aria-controls="v-validadores" aria-selected="false" tabindex="-1"><span class="pt-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="2"/><circle cx="17" cy="7" r="2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 7h6M7 9v6M17 9v6M9 17h6"/></svg></span><span class="pt-eti">Validadores</span></button>
        <button type="button" role="tab" id="t-nodo" aria-controls="v-nodo" aria-selected="false" tabindex="-1"><span class="pt-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="6" rx="2"/><rect x="3.5" y="13" width="17" height="6" rx="2"/><path d="M7 8h.01M7 16h.01"/></svg></span><span class="pt-eti">Nodo</span></button>
        <button type="button" role="tab" id="t-esfera" aria-controls="v-esfera" aria-selected="false" tabindex="-1"><span class="pt-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.6" ry="8.5"/><path d="M3.7 9.5h16.6M3.7 14.5h16.6"/></svg></span><span class="pt-eti">Esfera</span></button>
      </nav>
      <!-- Lo rellena `montarTema()` UNA VEZ, no en cada repintado. Ver tema.js -->
      <div class="tm" id="tmCaja"></div>
    </div>

    <div class="vista" role="tabpanel" id="v-resumen"     aria-labelledby="t-resumen"     tabindex="0"></div>
    <div class="vista" role="tabpanel" id="v-ganancias"   aria-labelledby="t-ganancias"   tabindex="0" hidden></div>
    <div class="vista" role="tabpanel" id="v-validadores" aria-labelledby="t-validadores" tabindex="0" hidden></div>
    <div class="vista" role="tabpanel" id="v-nodo"        aria-labelledby="t-nodo"        tabindex="0" hidden></div>

    <!-- ⚠ Esta vista NO la repinta `pintar()`. Las otras cuatro se regeneran
         enteras en cada refresco con `innerHTML`, y hacerlo aquí arrancaría el
         lienzo de WebGL del DOM cada 18 segundos: se perdería el contexto y con
         él la esfera. Lo marca `estatica: true` en `PESTANAS`. -->
    <div class="vista" role="tabpanel" id="v-esfera" aria-labelledby="t-esfera" tabindex="0" hidden>
      <div id="escena">
        <!-- `aria-hidden`: la esfera es decoración con dato, y el mismo dato
             está en la tabla de Validadores, que sí se puede leer y recorrer. -->
        <p id="rotulo" hidden aria-hidden="true">
          <span class="r-id"></span><span class="r-blq"></span>
        </p>
      </div>
      <p class="esfera-pie">
        <!-- «frente al grupo» no sobra: el tamaño no cifra el número de
             bloques sino cuánto se aparta de la mediana, y por eso doce
             validadores parejos salen parejos por muchos bloques que
             acumulen. Ver `intensidadesDesde()`. -->
        <span>Un punto por validador · <b>el tamaño</b> son sus bloques frente al grupo</span>
        <span><b>El brillo</b> sube con el ciclo de barrido y cae al cobrarlo</span>
        <span><b>Gris</b> = dato viejo · <b>latiendo</b> = esperando activación</span>
        <span>Toca un punto para ver cuál es</span>
      </p>
    </div>
  </div>
</main>

<script type="module">
  import { engancharNav } from './paneles/nav.js';
  import { iniciarCarga } from './carga/carga.js';
  import * as pantallaCarga from './carga/naciendo.js';
  import { escenaDesde } from './escena/estado-escena.js';
  import { cargarTodo } from './datos.js';
  import { panelResumen, engancharResumen, tictac } from './paneles/resumen.js';
  import { panelGanancias } from './paneles/ganancias.js';
  import { panelCiclo, engancharCiclo } from './paneles/ciclo.js';
  import { panelTrayectoria } from './paneles/trayectoria.js';
  import { engancharSimulador } from './paneles/simulador.js';
  import { panelAportaciones, engancharAportaciones } from './paneles/aportaciones.js';
  import { panelPrecio } from './paneles/precio-historico.js';
  import { panelPrecioSimulado, engancharPrecioSimulado } from './paneles/precio-simulado.js';
  import { panelValidadores } from './paneles/validadores.js';
  import { panelHitos } from './paneles/hitos.js';
  import { panelSaludNodo } from './paneles/salud-nodo.js';
  import { panelEstadoGlobal } from './paneles/estado-global.js';
  import { panelRegistro } from './paneles/registro.js';
  import { latir } from './paneles/pulso.js';
  import { montarTema } from './paneles/tema.js';
  import { montarPuerta, cerrarSesion } from './puerta.js';

  const q = new URLSearchParams(location.search);
  // `?escalon=` fuerza un escalón de calidad, para comparar en una misma
  // máquina lo que en otro caso decidiría la heurística.
  const forzado = q.get('escalon');

  // El rótulo del validador señalado. Vive en el DOM y no en una textura: es
  // texto de verdad, nítido a cualquier densidad, y no hay que subir nada a la
  // GPU cada vez que cambia el recuento de validadores.
  const rotulo = document.getElementById('rotulo');

  /* ⚠ La esfera NO se crea aquí. La crea la pantalla de carga, a pantalla
     completa, y al acabar se muda al hueco de esta pestaña con `mudar()`.

     No es un capricho de puesta en escena: si se creara aquí y la pantalla de
     carga creara la suya, habría DOS contextos de WebGL a la vez y DOS
     compilaciones de shaders —708 ms medidos cada una por software—. Con la
     mudanza se compila una sola vez, igual que antes de que la pantalla
     existiera, y encima la esfera que se ha visto nacer es la misma que se
     queda.

     Hasta que llega, `esfera` es null: todo lo que la usa pasa por `hayEsfera`
     o por `?.`, porque el panel se pinta debajo mientras la carga sigue puesta. */
  let esfera = null;
  const opcionesEsfera = {
    escalon: ['alto', 'medio', 'bajo'].includes(forzado) ? forzado : null,
    alSenalar(n) {
      if (!n) { rotulo.hidden = true; return; }
      /* Sin índice —la cadena aún no lo conoce— se le llama por su clave,
         que es lo único que tiene. Poner «null» ahí sería peor que no poner
         nada. */
      rotulo.querySelector('.r-id').textContent =
        n.indice == null ? (n.pubkeyCorta || 'sin número') : n.indice;
      /* El que espera turno no tiene bloques que contar, y decir «0 bloques»
         sería contestar a la pregunta equivocada: lo que hay que saber de él
         es que aún no ha empezado. Y las dos esperas no son la misma: una
         está en la cadena sin turno, la otra ni siquiera la conoce. */
      rotulo.querySelector('.r-blq').textContent = n.esperando
        ? 'esperando a entrar en la cadena'
        : n.pendiente
        ? 'esperando activación'
        : n.bloques === 1 ? '1 bloque' : `${n.bloques} bloques`;
      // Pendiente NO es inactivo: no se pinta en el color de lo que va mal.
      rotulo.classList.toggle('inactivo', n.activo === false && !n.pendiente);
      rotulo.classList.toggle('pendiente', n.pendiente === true);
      // El segundo `translate` es el centrado sobre el nodo, en porcentaje del
      // propio rótulo: tiene que ir aquí y no en el CSS, porque escribir
      // `transform` desde JS sustituye la propiedad entera.
      rotulo.style.transform =
        `translate(${Math.round(n.x)}px, ${Math.round(n.y)}px) translate(-50%, -150%)`;
      rotulo.hidden = false;
    },
  };

  // ⚠ La esfera arranca VACÍA, sin un solo nodo, y se llena cuando llegan los
  //   datos. Antes arrancaba con diez nodos inventados de `datos-falsos.js`,
  //   que es de donde salía el 10 con once validadores activos. Ese fichero ya
  //   no existe: si los datos no llegan, no hay nodos, y eso se ve — que es
  //   justo lo que no pasaba antes.
  //
  //   El `?n=` para forzar un número de nodos falsos se va con él.

  /* El gancho de diagnóstico. Se asigna cuando la esfera EXISTE, que desde que
     la crea la pantalla de carga ya no es al cargar el módulo sino al
     entregarla —ver el arranque, más abajo—. Antes se ponía aquí arriba y
     valía `null` los primeros dos segundos; las pruebas que esperaban a
     `window.__esfera` se quedaban colgadas mirando un nulo. */
  window.__esfera = null;

  /* ───────────────────────────────────────────── pestañas

     Cada pestaña responde a una pregunta distinta, y ese es el criterio de
     reparto — no «cuántos paneles caben en cada una»:

       Resumen     ¿cuánto llevo y va todo bien?   (sin desplazarse)
       Ganancias   ¿de dónde sale y hacia dónde va?
       Validadores ¿cuál de ellos está raro?
       Nodo        ¿cómo está la máquina, y qué ha pasado?

     El ritmo por periodos vivía en un panel propio y ahora está dentro de
     Resumen: era lo primero que hay que responder. Ver `paneles/ritmo.js`. */

  const PESTANAS = [
    { id: 'resumen',     paneles: [panelResumen, panelPrecio] },
    { id: 'ganancias',   paneles: [panelGanancias, panelCiclo, panelPrecioSimulado, panelAportaciones] },
    { id: 'validadores', paneles: [panelValidadores, panelHitos, panelTrayectoria] },
    { id: 'nodo',        paneles: [panelSaludNodo, panelEstadoGlobal, panelRegistro] },
    // `estatica`: su HTML lo escribió el documento y no se regenera nunca. Ver
    // el aviso junto a `#v-esfera` en el marcado.
    { id: 'esfera',      paneles: [], estatica: true },
  ];

  const tabs = PESTANAS.map(p => document.getElementById(`t-${p.id}`));
  const vistas = PESTANAS.map(p => document.getElementById(`v-${p.id}`));

  // El hash manda: recargar con `#nodo` abre Nodo. Así un enlace a una pestaña
  // concreta funciona, y un refresco no devuelve siempre a Resumen.
  const desdeHash = () => {
    const i = PESTANAS.findIndex(p => p.id === location.hash.slice(1));
    return i < 0 ? 0 : i;
  };

  let activa = desdeHash();

  function activar(i, { mover = true, animar = true, sellarHash = true } = {}) {
    activa = i;
    PESTANAS.forEach((p, j) => {
      const sel = j === i;
      tabs[j].setAttribute('aria-selected', String(sel));
      tabs[j].tabIndex = sel ? 0 : -1;
      vistas[j].hidden = !sel;
    });

    // La animación de entrada se pone SOLO al cambiar de pestaña. Si viviera
    // en la clase `.vista` a secas se repetiría en cada refresco de datos —
    // un parpadeo cada 18 segundos mientras miras un número.
    if (animar) {
      const v = vistas[i];
      v.classList.remove('entrando');
      void v.offsetWidth;          // reinicia la animación
      v.classList.add('entrando');
    }
    if (mover) tabs[i].focus();
    // El hash solo se escribe al cambiar de pestaña a mano. En el arranque no:
    // abrir /val/v2/ y ver cómo la barra de direcciones se convierte sola en
    // /val/v2/#resumen parece que la página ha hecho algo raro.
    if (sellarHash && location.hash.slice(1) !== PESTANAS[i].id) {
      history.replaceState(null, '', `#${PESTANAS[i].id}`);
    }
    // El pulso puede haber entrado en pantalla justo ahora: que no espere al
    // siguiente segundo para ponerse al día.
    latir();
  }

  tabs.forEach((t, i) => t.addEventListener('click', () => activar(i, { mover: false })));

  // Flechas, Inicio y Fin, que es lo que espera quien navega por teclado en un
  // `tablist`. Sin esto el `role="tab"` promete algo que no cumple.
  document.querySelector('.pestanas').addEventListener('keydown', ev => {
    const salto = { ArrowRight: 1, ArrowLeft: -1 }[ev.key];
    if (salto) activar((activa + salto + tabs.length) % tabs.length);
    else if (ev.key === 'Home') activar(0);
    else if (ev.key === 'End') activar(tabs.length - 1);
    else return;
    ev.preventDefault();
  });

  window.addEventListener('hashchange', () => activar(desdeHash(), { mover: false }));

  /* El engranaje del tema, UNA VEZ. Vive en la barra y no en una pestaña, así
     que no lo toca el repintado de cada 18 segundos — que es justo lo que hace
     falta: si lo regenerara, el desplegable se cerraría solo mientras eliges. */
  montarTema(document.getElementById('tmCaja'), {
    /* Cerrar sesión de verdad: solo se navega si el servidor CONFIRMA que ha
       borrado la cookie. Si no, `montarTema` deja el botón diciéndolo. Ver la
       nota larga en `puerta.js`. */
    async alSalir() {
      const ok = await cerrarSesion();
      if (ok) window.location.href = '/';
      return ok;
    },
  });

  /* ───────────────────────────────────────────── paneles */

  let ultimos = null;

  /* ───────────────────────────────────────── destellos de bloque

     Un bloque propuesto es el único suceso PUNTUAL que tiene el panel: los
     demás números son magnitudes que suben y bajan. La esfera lo marca con un
     golpe de luz en el nodo de ese validador y una onda que sale de él.

     De dónde sale el hecho: del registro de eventos, `tipo === 'bloque'`, que
     los escribe `/api/val/ganancia` al reconciliar los barridos contra la
     cadena. No se inventa ninguno.

     ⚠ Solo destellan los bloques que llegan NUEVOS. En el primer pintado se
       apunta el más reciente sin encender nada: si no, abrir el panel dispararía
       de golpe los sesenta últimos bloques del histórico, que es una fiesta que
       no significa nada. */
  let ultimoBloqueTs = null;

  function destellarBloquesNuevos(datos) {
    const bloques = (datos.eventos || [])
      .filter(e => e.tipo === 'bloque' && Number.isFinite(Number(e.ts)))
      .sort((a, b) => Number(a.ts) - Number(b.ts));
    if (!bloques.length) return;

    if (ultimoBloqueTs == null) {          // primer pintado: solo tomar nota
      ultimoBloqueTs = Number(bloques[bloques.length - 1].ts);
      return;
    }
    for (const b of bloques) {
      if (Number(b.ts) <= ultimoBloqueTs) continue;
      ultimoBloqueTs = Number(b.ts);
      if (b.validador != null) esfera?.destello(Number(b.validador));
    }
  }

  function pintar(datos) {
    ultimos = datos;

    // La esfera es el fondo de las cuatro pestañas, así que se actualiza aquí y
    // no dentro de ninguna: sus nodos son los validadores reales, su brillo el
    // avance del ciclo de barrido y su color la frescura del dato.
    /* `?.` y no a secas: durante la pantalla de carga el panel ya se está
       pintando debajo pero la esfera todavía no se ha entregado. Y aunque
       existiera, no habría que tocarla: mientras nace la conduce la pantalla
       de carga, y escribirle los nodos reales por encima le pisaría el
       encendido escalonado. Al entregarla se le pasan los datos de una vez. */
    esfera?.actualizar(escenaDesde(datos, datos.ahoraS));
    destellarBloquesNuevos(datos);

    PESTANAS.forEach((p, i) => {
      if (p.estatica) return;
      vistas[i].innerHTML = p.paneles.map(fn => fn(datos)).join('');
    });
    // Las dos capas interactivas se pierden con el HTML, que se regenera
    // entero: hay que volver a engancharlas en cada repintado.
    engancharCiclo(document, datos);
    engancharResumen(document, () => pintar(ultimos));
    // Tras apuntar o borrar hay que volver a PEDIR: el histórico vive en D1,
    // no en `ultimos`. Por eso `refrescar` y no `pintar`.
    engancharAportaciones(document, () => refrescar());
    engancharSimulador(document, datos);
    engancharPrecioSimulado(document, datos);
    window.__datos = datos;
    // Ganchos de diagnóstico, como `__esfera`: desde la consola se puede forzar
    // un repintado sin esperar 18 segundos, y la prueba del bloque 2 lo usa para
    // comprobar que el repintado NO se lleva el lienzo de la esfera por delante.
    window.__pintar = () => pintar(ultimos);
  }

  /* ───────────────────────────────────────────── refresco

     15-20 s para que el pulso de datos se note en tiempo real. NO es la
     frecuencia del recolector: el NUC sigue empujando a KV cada 3 minutos por
     la cuota de escrituras, y tocar eso aquí no serviría de nada — lo único
     que cambia es cada cuánto se vuelve a leer lo que ya está publicado. */
  const REFRESCO_MS = 18000;

  async function refrescar() {
    try {
      const datos = await cargarTodo();
      /* La sesión dura 30 días y puede caducar CON EL PANEL ABIERTO. Antes eso
         dejaba el panel puesto diciendo «SIN SESIÓN» en una esquina y todos los
         números congelados en el último dato bueno — que es la peor mezcla
         posible: parece que va y no va. Ahora vuelve la puerta. */
      if (datos.sesion === false) { volverALaPuerta(); return; }
      pintar(datos);
    } catch (e) {
      // `cargarTodo` ya absorbe los fallos por endpoint; llegar aquí es un
      // fallo del propio módulo, y callarlo dejaría la pantalla de carga fija.
      console.error('[val/v2] no se pudieron cargar los datos:', e);
      // Nunca sobre la vista de la esfera: se llevaría el lienzo por delante.
      const destino = PESTANAS[activa].estatica ? vistas[0] : vistas[activa];
      destino.innerHTML =
        '<section class="panel" data-alerta><p class="p-aviso">'
        + 'No se pudieron cargar los datos del panel.</p></section>';
    }
  }

  /* La barra se contrae al desplazar y se expande cuando el desplazamiento
     PARA — no cuando se levanta el dedo. Ver nav.js. */
  engancharNav();

  /* ── la hoja vieja en la caché ────────────────────────────────────────────
     Pasó, y se pudo reproducir: en el iPhone, Safari y la app instalada tienen
     CACHÉS SEPARADAS. En la app entró la hoja nueva y en Safari se quedó la de
     antes, así que se veía el marcado nuevo —con iconos— maquetado con reglas
     viejas: la barra arriba, los iconos enormes y las etiquetas encima unas de
     otras. Reproducido sirviendo el `index.html` de hoy con la hoja anterior.

     `_headers` ya manda `no-cache` para `/val/v2/*`, y aun así ocurrió. Como no
     se puede depender de que todas las capas lo respeten, esto lo comprueba: si
     el marcado es el nuevo y la hoja no lo es, se vuelve a pedir saltándose la
     caché. Se cura solo en una recarga en vez de quedarse así hasta que alguien
     borre los datos del sitio.

     La sonda es `position: fixed` en la barra por debajo de 820px, que es
     EXACTAMENTE lo que faltaba en la captura. No detecta cualquier desfase —solo
     este— y eso es lo que hay: una sonda concreta que se sabe que funciona vale
     más que una genérica que no se ha visto fallar nunca. */
  (function vigilarHoja() {
    const barra = document.querySelector('.barra');
    if (!barra || !window.matchMedia('(max-width: 819px)').matches) return;
    if (getComputedStyle(barra).position === 'fixed') return;      // al día
    const enlace = document.querySelector('link[href*="paneles/estilo.css"]');
    if (!enlace || enlace.dataset.repescada) return;                // una vez y no más
    console.warn('[val/v2] hoja de estilo desfasada en la caché; se vuelve a pedir');
    const nuevo = enlace.cloneNode();
    nuevo.dataset.repescada = '1';
    nuevo.href = enlace.href.split('?')[0] + '?v=' + Date.now();
    nuevo.addEventListener('load', () => enlace.remove());
    enlace.after(nuevo);
  })();

  activar(activa, { mover: false, animar: false, sellarHash: false });

  /* El arranque: la pantalla de carga por encima, los datos por debajo, y la
     esfera mudándose a su pestaña al final.

     El orden de los `await` ES la promesa que se le hizo al panel: `refrescar()`
     pinta los paneles mientras la carga sigue puesta, y `terminar()` no vuelve
     hasta que la animación ha hecho su entrada entera, ha cumplido el mínimo y
     ha hecho su salida entera. Si los datos tardan, la carga se alarga sola.

     Si la esfera no se puede crear —WebGL apagado, contexto perdido— no se
     puede dejar al panel sin arrancar: se cae al aviso de texto de siempre y el
     resto del panel funciona igual, solo que sin esfera. Antes de esto un fallo
     de WebGL se llevaba por delante el módulo entero. */
  /* ⚠ LA PRIMERA PETICIÓN ES TAMBIÉN LA COMPROBACIÓN DE SESIÓN, y por eso el
     arranque cambió de forma. `cargarTodo()` ya devuelve `sesion: false` cuando
     los endpoints contestan 401, así que no hace falta ni un endpoint nuevo ni
     una petición de más: se pide lo de siempre y se mira lo que ya venía.

     La pantalla de carga arranca A LA VEZ, sin esperar. Es deliberado: con
     sesión —el caso de casi todas las visitas, la cookie dura 30 días— las dos
     cosas corren en paralelo igual que antes y el arranque no cuesta ni un
     milisegundo más. Sin sesión, la carga se aborta en cuanto se sabe y en su
     sitio aparece la puerta.

     Esperar a la respuesta ANTES de montar la carga habría sido más simple de
     leer, pero le suma la ida y vuelta a cada arranque con sesión para ahorrar
     un destello a uno de cada treinta días. */
  let arrancado = false;
  let latido = null;                      // el `setInterval` del refresco

  /** La sesión ha caducado con el panel abierto: se para todo y se pide el PIN. */
  function volverALaPuerta() {
    clearInterval(latido);
    latido = null;
    arrancado = false;
    abrirPuerta();
  }

  async function arrancar() {
    if (arrancado) return;
    arrancado = true;

    const primeros = cargarTodo();          // sin await: que corra ya
    let carga = null;
    try {
      carga = iniciarCarga(document.body, pantallaCarga, {
        opcionesEsfera,
        alEntregar(e) {
          esfera = e;
          window.__esfera = e;
          esfera.mudar(document.getElementById('escena'));
          // Ahora sí: los nodos reales, de una vez, sobre la esfera ya hecha.
          if (ultimos) esfera.actualizar(escenaDesde(ultimos, Math.floor(Date.now() / 1000)));
        },
      });
    } catch (e) {
      console.error('[val/v2] la pantalla de carga no arrancó:', e);
      if (!PESTANAS[activa].estatica)
        vistas[activa].innerHTML = '<div id="cargando">Cargando…</div>';
    }

    let datos = null;
    try { datos = await primeros; }
    catch (e) { console.error('[val/v2] no se pudieron cargar los datos:', e); }

    if (datos && datos.sesion === false) {
      // Sin sesión no hay panel que enseñar ni esfera que entregar.
      carga?.abortar();
      arrancado = false;                    // para poder volver tras el PIN
      abrirPuerta();
      return;
    }

    if (datos) pintar(datos); else await refrescar();
    if (carga) { try { await carga.terminar(); } catch (e) { console.error('[val/v2] carga:', e); } }
    clearInterval(latido);                // por si se vuelve a arrancar
    latido = setInterval(refrescar, REFRESCO_MS);
  }

  function abrirPuerta() {
    /* El panel se esconde del árbol de accesibilidad mientras la puerta está
       puesta. Taparlo con una capa opaca basta para el ojo, pero no para un
       lector de pantalla ni para el tabulador: sin esto se puede recorrer con
       el teclado un panel vacío que está detrás del PIN. */
    const marco = document.querySelector('.marco');
    if (marco) marco.inert = true;
    montarPuerta(document.body, {
      alEntrar() {
        if (marco) marco.inert = false;
        return arrancar();
      },
    });
  }

  arrancar();

  // El pulso corre a su propio ritmo. Los datos llegan cada 18 s, pero la
  // cuenta atrás tiene que avanzar segundo a segundo: si solo se moviera con
  // los datos, daría saltos de 18 y no parecería una cuenta atrás.
  //
  // Y cuando cruza el umbral —de «llega en plazo» a «sin señal» o al revés— se
  // repinta el panel con los datos que ya hay: la palabra de estado y la franja
  // de alerta las decide `panelResumen`, y sin este aviso tardarían hasta 18
  // segundos en enterarse de lo que el pulso ya está diciendo en naranja.
  //
  // Y en el mismo tic corre el contador de ganancias: al ritmo medido, la cifra
  // avanza del orden de un PLS por segundo, así que el último dígito cambia
  // cada vez. Ver la nota de `tictac()`.
  let pulsoPrevio = null;
  setInterval(() => {
    const ahora = latir();
    if (ahora && pulsoPrevio && ahora !== pulsoPrevio && ultimos) pintar(ultimos);
    if (ahora) pulsoPrevio = ahora;
    tictac();
    /* El ciclo de barrido dura ~8,1 h y su avance solo se recalculaba con los
       datos, cada 18 s. Recalcularlo cada segundo con el reloj de ahora es lo
       que hace que el brillo suba de forma continua en vez de a escalones —y,
       sobre todo, que la CAÍDA al cobrarse el barrido se vea cuando pasa. Es
       la misma cuenta, con la hora al día: no se inventa nada. */
    if (ultimos) esfera?.actualizar(escenaDesde(ultimos, Math.floor(Date.now() / 1000)));
  }, 1000);
</script>
</body>
</html>
