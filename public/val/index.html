<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>PLSDASH · panel</title>
<link rel="icon" href="/favicon.ico">
<!--
  Aquí vivía el panel v1: 2.017 líneas con su propio PIN, su propia carga y su
  propia copia de la lógica de ganancias. Se retiró el 8-sep-2026, cuando el v2
  dejó de necesitarlo: hasta entonces `/val/v2/` sin sesión mandaba a `/val/` a
  meter el PIN, y por eso el v1 seguía en pie.

  ⚠ ESTO NO ES UN FICHERO DE RELLENO. `/val/` tiene que seguir existiendo:

    · Es a donde lleva el Vault de la portada. `vault.js` navega a `/val/`, y
      dejarlo en 404 rompería el único camino que hay hasta el panel.
    · Es donde está la regla de limitación de peticiones.
    · Es lo que hay en los marcadores y en la app instalada de quien lo usa.

  Se redirige en vez de mover el v2 aquí. Mover treinta ficheros en el mismo
  cambio que retira la única alternativa era, precisamente, el riesgo que se
  quería evitar: si algo sale mal, esto se revierte solo y el panel sigue en
  su sitio.

  Dos caminos a propósito. El `meta refresh` funciona sin JavaScript y es el que
  responde si el script falla; el `location.replace` va antes porque no deja
  entrada en el historial —con `href`, el botón de atrás rebotaría aquí y
  volvería a mandarte adelante, y no se podría salir del panel.
-->
<meta http-equiv="refresh" content="0; url=/val/v2/">
<script>location.replace('/val/v2/' + location.hash);</script>
<style>
  body{
    margin:0;min-height:100dvh;display:grid;place-items:center;
    background:#000;color:#628b9b;
    font:400 13px/1.5 'Inter',system-ui,-apple-system,sans-serif;
    text-align:center;padding:24px;
  }
  a{color:#2ad4f0}
</style>
</head>
<body>
  <p>El panel está en <a href="/val/v2/">/val/v2/</a>.</p>
</body>
</html>
